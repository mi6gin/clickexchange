{% extends 'core/base.html' %}

{% block title %}Вход — ClickExchange{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Вход</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  <p class="auth-hint">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
